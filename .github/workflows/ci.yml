name: CI

on:
  push:
    branches: [main, desarrollo]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests y cobertura
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      # Mobile tests are the active suite since the legacy src/ mirror was removed
      # (see change delete-legacy-src-mirror). Root coverage is no longer produced.
      # `npx jest --coverage` para que mobile/coverage/ se genere y el
      # upload de artifact pueda encontrarlo (mobile no tiene `test:coverage`
      # script en package.json — solo `test`).
      - name: Ejecutar tests mobile con cobertura
        run: cd mobile && npx jest --coverage --silent

      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: mobile/coverage/
          retention-days: 30
